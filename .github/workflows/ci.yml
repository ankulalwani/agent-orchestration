name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  boundary-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the secret scan covers the whole history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Boundary check (no private code, packages or configuration)
        run: node scripts/check-boundary.mjs
      - name: Secret scan (history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner

  test:
    runs-on: ubuntu-latest
    env:
      AO_TEST_REDIS: /usr/bin/redis-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Redis for queue and chaos tests
        run: sudo apt-get update && sudo apt-get install -y redis-server && sudo systemctl stop redis-server || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Chromium for the browser tests (dashboard, worker UI, browser verification, QA discovery)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
        env:
          VITEST_MAX_FORKS: 2
      - run: pnpm build
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the self-hosted image
        run: docker build -f deployment/docker/control-plane.Dockerfile -t agent-orchestrator:ci .
      - name: Start with Docker Compose and check health
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/; s/^ENCRYPTION_KEY=.*/ENCRYPTION_KEY=$(openssl rand -hex 32)/" .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:4000/healthz && break; sleep 2; done
          curl -fsS http://localhost:4000/api/v1/server-info
          docker compose down -v
