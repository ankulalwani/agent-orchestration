# Self-hosted control plane: API + web, MongoDB, Redis. Optional MinIO via `--profile storage`.
#   cp .env.example .env   # set JWT_SECRET and ENCRYPTION_KEY
#   docker compose up -d --build
# Then open http://localhost:4000
services:
  control-plane:
    build:
      context: .
      dockerfile: deployment/docker/control-plane.Dockerfile
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/agent_orchestration}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "4000:4000"
    volumes:
      - artifacts:/app/data   # task artifacts (screenshots, logs) unless S3 is configured
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"
    restart: unless-stopped

volumes:
  artifacts:
  mongo-data:
  redis-data:
  minio-data:
