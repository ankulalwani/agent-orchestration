# Checked with `helm lint --strict` and kubeconform, and installed on Docker Desktop's Kubernetes (v1.36) with
# autoscaling, backups and monitoring on. Not yet on a managed cloud cluster.
image:
  repository: agent-orchestration   # build with deployment/docker/control-plane.Dockerfile and push to your registry
  tag: "0.2.0"
  pullPolicy: IfNotPresent

# Scheduling is safe with several replicas only when REDIS_URL is set (BullMQ + live-update bridge).
replicaCount: 1

# Existing Secret with keys: JWT_SECRET, ENCRYPTION_KEY, MONGODB_URI, and optionally ENCRYPTION_KEYS_PREVIOUS, REDIS_URL, SMTP_URL,
# S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY. Create it yourself (kubectl create secret generic ...).
existingSecret: agent-orchestration

env:
  PUBLIC_URL: https://orchestration.example.com
  WEB_URL: https://orchestration.example.com
  CORS_ORIGINS: https://orchestration.example.com
  TRUST_PROXY: "true"
  ALLOW_REGISTRATION: "false"
  METRICS_ENABLED: "true"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: orchestration.example.com
  tls: []          # e.g. [{ secretName: orchestration-tls, hosts: [orchestration.example.com] }]
  annotations: {}  # WebSockets must be allowed by your ingress controller

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }

# ── Operations (all off by default) ───────────────────────────────────────────
# Scaling: a HorizontalPodAutoscaler on CPU. Needs REDIS_URL in the secret. With several replicas (or
# autoscaling) a PodDisruptionBudget keeps one instance up during drains.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Scheduled MongoDB backups (mongodump --archive --gzip). Kept on a volume with retention, or uploaded to
# S3-compatible storage when s3.bucket is set (credentials: S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY in the secret).
backup:
  enabled: false
  schedule: "0 2 * * *"
  image: mongo:8.0
  retentionDays: 14
  persistence:
    size: 20Gi
    storageClass: ""
    existingClaim: ""
  s3:
    bucket: ""
    prefix: agent-orchestration/
    region: us-east-1
    endpoint: ""       # for S3-compatible storage (MinIO, SeaweedFS, R2, ...)
    image: amazon/aws-cli:2.22.35

# Prometheus Operator objects (need its CRDs): scraping of /metrics, and alert rules.
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}         # e.g. { release: kube-prometheus-stack }
  prometheusRule:
    enabled: false
    labels: {}
    failedTasksPerHour: 10
