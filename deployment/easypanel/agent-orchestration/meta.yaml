schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: agent-orchestration
    appServiceImage:
      type: string
      title: App Service Image
      default: ghcr.io/ankulalwani/agent-orchestration:0.2.0
    allowRegistration:
      type: boolean
      title: Allow registration after the first account
      default: true
benefits:
  - title: Your Agents, Your Machines
    description:
      Tasks run on workers you control, with the coding agents already signed
      in there. Code, prompts and keys stay on your infrastructure.
  - title: Verified Results
    description:
      Each task runs your verification commands and is committed on its own
      branch. Reports show what was verified and what the agent only claimed.
  - title: No Limits
    description:
      The self-hosted control plane has no licence checks, telemetry or limits
      on tasks, workers, members or projects.
features:
  - title: Multi-Agent Dispatch
    description:
      Works with Claude Code, Codex, Gemini CLI, OpenCode and Aider, with
      fallback models when an agent reaches its usage limit.
  - title: Web Dashboard, Mobile App and IDE
    description:
      Manage projects, tasks and workers from the dashboard, the mobile app or
      the VS Code extension.
  - title: Single Sign-On
    description:
      Sign in with Google, GitHub or any OpenID Connect provider.
  - title: Capability Registry
    description:
      Share skills, MCP servers and capabilities across your installation.
tags:
  - AI
  - Developer Tools
  - Automation
  - Agents
