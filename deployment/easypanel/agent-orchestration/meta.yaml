name: Agent Orchestration
description:
  Agent Orchestration is a self-hosted control plane for AI coding agents. It
  dispatches tasks to workers on your own machines, where Claude Code, Codex,
  Gemini CLI, OpenCode or Aider do the work. Every task is verified with your
  own commands (tests, typecheck, build) and committed on a task branch, and the
  report separates verified results from the agent's claims. This template runs
  the API and web dashboard with MongoDB and Redis. Self-hosted installations
  make no calls to vendor infrastructure and have no limits on tasks, workers,
  members or projects.
instructions:
  Open the app domain and create the first account right away. The first
  account becomes the platform administrator. Then set ALLOW_REGISTRATION=false
  in the app's environment, or turn off registration in the dashboard (Server
  settings), and invite members from Settings → Members. Back up the
  ENCRYPTION_KEY value from the app's environment. Without it, stored secrets
  cannot be recovered. Workers run on developer machines and connect outbound to
  this server; see the self-hosting guide to install one.
changeLog:
  - date: 2026-09-30
    description: first release (0.2.0)
