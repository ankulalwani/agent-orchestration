[package]
name = "ao-desktop"
version = "0.2.0"
description = "Desktop app for the Agent Orchestration worker"
edition = "2021"
rust-version = "1.77.2"
publish = false

[[bin]]
name = "agent-orchestration-worker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loopback HTTP to the worker's local API only, so no TLS.
ureq = { version = "2", default-features = false }
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
